name: travixy
description: LikeALocal - Travel like a local

environment:
  sdk: ^3.11.0

dependencies:
  flutter_staggered_grid_view: ^0.7.0
  flutter:
    sdk: flutter
  
    
  shared_preferences: ^2.3.0
  http: ^1.2.0
  
  
  # Firebase (Split 1)
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.0.0   # ← add this
  firebase_messaging: ^15.2.0
  google_sign_in: ^6.2.2
  
  # State Management (Split 1)
  provider: ^6.1.2
  
  # Navigation (Split 1)
  go_router: ^14.6.3
  
  # Maps & Location (Split 2)
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  
  # Background & Notifications (Fixed - removed background_locator)
  flutter_local_notifications: ^18.0.1
  
  # Offline Storage (Split 2)
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  
  # Utilities
  google_maps_flutter_android: ^2.14.7
  equatable: ^2.0.7
  image_picker: ^1.1.2
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
        - asset: assets/fonts/Poppins-Bold.ttf


flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/Travixy Logo 1.png